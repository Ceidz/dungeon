  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;background:#07080c;overscroll-behavior:none;position:fixed;width:100%;height:100%;}
    #root{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    #loading{position:fixed;inset:0;background:#07080c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:99999;color:#c8a96e;font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:13px;letter-spacing:4px;transition:opacity 0.5s ease;}
    #loading .logo{font-size:42px;animation:loadFloat 2s ease-in-out infinite;}
    #loading .spinner{width:36px;height:36px;border:2px solid #1a1a2e;border-top-color:#c8a96e;border-radius:50%;animation:spin 0.9s linear infinite;}
    #loading .label{color:#4a4030;font-size:11px;letter-spacing:5px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes loadFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
    #loading.fade-out{opacity:0;pointer-events:none;}
  </style>
  <style id="responsive-layer">

    :root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    html,body{overflow-x:hidden;}
    #root{padding:var(--sat) var(--sar) var(--sab) var(--sal);overflow-x:hidden;}
    img,svg,video,canvas{max-width:100%;}

    #root [style*="min-height: 100vh"]{min-height:calc(100dvh - var(--sat) - var(--sab))!important;}

    .fab-chat{bottom:calc(16px + var(--sab))!important;left:calc(16px + var(--sal))!important;}
    [style*="z-index: 9999"]{top:calc(14px + var(--sat))!important;right:calc(14px + var(--sar))!important;}

    [style*="z-index: 10000"],[style*="z-index: 20000"]{overflow-y:auto!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:var(--sat);}
    @supports (align-items:safe center){[style*="z-index: 10000"]{align-items:safe center!important;}}

    @media (hover:none){
      html button:hover{opacity:1!important;transform:none!important;}
      html .cls-card:hover,html .slot-card:hover{transform:none!important;}
    }
    @media (pointer:coarse) and (max-width:1100px){
      input,select,textarea{font-size:16px!important;}
    }

    @media (max-width:380px){
      .cls-grid,.slot-grid{grid-template-columns:1fr 1fr!important;}
      .create-wrap{padding:10px!important;}
    }

    @media (max-height:520px){
      .game-log{height:68px!important;}
      .hud-bar{padding:6px 12px!important;}
    }

    @media (min-width:700px){
      .split{justify-content:center;}
      .game-col{flex:1 1 auto!important;max-width:900px;width:100%;border-left:1px solid rgba(255,255,255,0.05);}
      .tab-bar{padding:0 16px!important;}
      .tab-bar .nav-tab{flex:1 1 0;min-width:64px!important;}
      .tab-bar .nav-tab span:first-child{font-size:19px!important;}
      .hud-bar{padding:12px 20px!important;}
      .game-log{height:130px!important;padding:10px 20px!important;}
      .map-grid,.shop-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important;}
      .create-wrap{max-width:820px!important;padding:32px 24px!important;}
      .cls-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))!important;}
    }

    @media (min-width:768px){
      #root [style*="font-size: 8px"]{font-size:10px!important;}
      #root [style*="font-size: 9px"]{font-size:11px!important;}
      #root [style*="font-size: 10px"]{font-size:12px!important;}
      #root [style*="font-size: 11px"]{font-size:13px!important;}
      #root [style*="font-size: 12px"]{font-size:14px!important;}
    }

    @media (min-width:1100px){
      .split{height:calc(100dvh - var(--sat) - var(--sab));}
      .game-col{
        max-width:1480px;
        display:grid!important;
        grid-template-columns:minmax(310px,350px) minmax(0,1fr);
        grid-template-rows:auto minmax(0,1fr);
        height:100%;
        border-left:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06)!important;
      }
      .game-col>*{grid-column:1/-1;min-width:0;}
      .tab-bar{grid-column:1/-1!important;grid-row:1;padding:0 24px!important;}
      .tab-bar .nav-tab{flex:0 1 96px;}
      .hud-bar{grid-column:1!important;grid-row:2;overflow-y:auto;border-bottom:none!important;border-right:1px solid rgba(255,255,255,0.06);padding:18px 18px!important;background:rgba(7,8,12,0.55)!important;}
      .content-area{grid-column:2!important;grid-row:2;min-height:0;min-width:0;}
      .game-log{height:150px!important;padding:12px 28px!important;}
      .map-grid,.shop-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))!important;}
      .create-wrap{max-width:980px!important;}
      #root [style*="font-size: 8px"]{font-size:11px!important;}
      #root [style*="font-size: 9px"]{font-size:12px!important;}
      #root [style*="font-size: 10px"]{font-size:13px!important;}
      #root [style*="font-size: 11px"]{font-size:14px!important;}
      #root [style*="font-size: 12px"]{font-size:15px!important;}
    }
    @media (min-width:1700px){
      .game-col{max-width:1700px;grid-template-columns:380px minmax(0,1fr);}
    }
    #root{overflow-wrap:break-word;}
    button:active:not(:disabled){transform:scale(.97)!important;}
    .nav-tab{transition:color .15s,background .15s,transform .1s;}
    .nav-tab:hover{background:rgba(255,255,255,.04);}
    .game-log{scroll-behavior:smooth;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12px);mask-image:linear-gradient(180deg,transparent 0,#000 12px);}
    .hud-bar{box-shadow:inset 0 -1px 0 rgba(255,255,255,.04);}
    .map-grid>*,.shop-grid>*{transition:transform .15s,box-shadow .15s,border-color .15s;}
    @media (hover:hover){.map-grid>*:hover,.shop-grid>*:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.35);}}
    @media (max-width:767px){
      #root [style*="font-size: 8px"]{font-size:10px!important;}
      #root [style*="font-size: 9px"]{font-size:11px!important;}
      #root [style*="font-size: 10px"]{font-size:12px!important;}
      #root [style*="font-size: 11px"]{font-size:12.5px!important;}
      .tab-bar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
      .tab-bar::-webkit-scrollbar{display:none;}
      .tab-bar .nav-tab{flex:1 0 auto;min-width:56px;min-height:48px;scroll-snap-align:center;}
      .combat-btns button{min-height:42px;}
      .player-side{width:100%!important;max-width:100vw;}
      .hud-bar{padding:10px 12px!important;}
      .game-log{padding:8px 12px!important;}
    }
    @media (max-width:360px){
      .tab-bar .nav-tab{min-width:48px;}
      .tab-bar .nav-tab span:first-child{font-size:16px!important;}
      .create-wrap{padding:8px!important;}
    }
    @media (max-height:520px) and (orientation:landscape){
      .tab-bar .nav-tab{min-height:38px;}
    }

                            , boardSort==="weekRp"?"📅 +"+(p.weekRp||0).toLocaleString()+" RP":boardSort==="rp"?getRank(p.rp).icon+" "+p.rp.toLocaleString()+" RP":boardSort==="level"?"Lv."+p.level:boardSort==="kills"?_optionalChain([p, 'access', _94 => _94.kills, 'optionalAccess', _95 => _95.toLocaleString, 'call', _96 => _96()])+"⚔️":"💰"+_optionalChain([p, 'access', _97 => _97.gold, 'optionalAccess', _98 => _98.toLocaleString, 'call', _99 => _99()])
                          )
                          , !p.isYou&&React.createElement('div', { style: {fontSize:9,color:p.status==="offline"?"#3a2a1a":"#55cc66",marginTop:2},}, p.status==="offline"?"● Offline":"● Online")
                        )
                      )
                    );
                  })
                )
              );
            })())

            , React.createElement('div', { ref: gameLogRef, className:"game-log", style: {height:110,overflowY:"auto",borderTop:"1px solid rgba(255,255,255,0.05)",padding:"8px 14px",background:"rgba(4,5,8,0.6)",flexShrink:0},}
              , gameLog.map((entry,i)=>{
                var colors={system:"#44cc88",gold:"#d4a840",combat:"#e08844",warn:"#ff6644",story:"#8a7870",npc:"#5a8090",xp:"#9966ff",info:"#4a4840"};
                return React.createElement('div', { key: i, style: {fontSize:11,color:colors[entry.type]||"#4a4840",padding:"1.5px 0",lineHeight:1.45,fontFamily:"'Crimson Text',Georgia,serif"},}, React.createElement('span', { style: {color:"#2a2420",marginRight:6,fontSize:10}},entry.t), entry.msg);
              })
            )
          )
        )

      )
    )
  );
}

    var root = ReactDOM.createRoot(document.getElementById('root'));
    class AppBoundary extends React.Component{
      constructor(p){super(p);this.state={err:null};}
      static getDerivedStateFromError(e){return{err:e};}
      componentDidCatch(e){console.error("Game crashed:",e);}
      render(){
        if(!this.state.err)return this.props.children;
        return React.createElement('div',{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"#07080c",color:"#d6cfc0",fontFamily:"Inter,system-ui,sans-serif"}},
          React.createElement('div',{style:{maxWidth:380,textAlign:"center"}},
            React.createElement('div',{style:{fontSize:20,color:"#c8a96e",marginBottom:8,fontFamily:"'Cinzel',serif",letterSpacing:2}},"Something went wrong"),
            React.createElement('div',{style:{fontSize:13,color:"#7d8596",marginBottom:18,lineHeight:1.6}},"Your progress is saved. Reload to continue."),
            React.createElement('button',{onClick:()=>location.reload(),style:{background:"rgba(200,169,110,.15)",border:"1px solid rgba(200,169,110,.5)",color:"#e8c87a",borderRadius:10,padding:"11px 22px",fontSize:14,cursor:"pointer"}},"Reload game")));
      }
    }
    root.render(React.createElement(AppBoundary,null,React.createElement(GMGame, null )));

  </script>
